name: Feature request / Предложение
description: "Suggest an idea for this project / Предложите идею для проекта"
title: "[Feature Request]"
labels: ["enhancement"]
body:
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm / Подтверждение
      description: Please confirm / Пожалуйста, подтвердите
      options:
        - label: I have checked the documentation and can't find the feature I'm looking for / Я посмотрел документацию и не нашёл нужной возможности
          required: true
        - label: I have searched the Issue and found no related feature requests / Я поискал по issue и не нашёл похожих предложений
          required: true
  - type: textarea
    id: description
    attributes:
      label: Feature Description / Описание
      description: Describe the feature you want / Опишите, что вы хотите
    validations:
      required: true
  - type: textarea
    id: how_to
    attributes:
      label: How to Implement / Как реализовать
      description: How to implement this feature / Как это можно сделать
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Information / Дополнительная информация
      description: Any other information you think might be helpful to implement this feature / Любая другая информация, которая поможет в реализации
    validations:
      required: false
