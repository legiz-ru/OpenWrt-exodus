name: BUG Report / Сообщение об ошибке
description: "Create a report to help us improve / Сообщите об ошибке, чтобы мы её исправили"
title: "[BUG]"
labels: ["bug"]
body:
  - type: checkboxes
    id: self_check
    attributes:
      label: Self-check / Самопроверка
      description: Self-Check before submitting the Issue / Проверьте перед отправкой issue
      options:
        - label: DNSMASQ's `DNS Redirect` option is turned off (ignore if not applicable) / Опция `DNS Redirect` в DNSMASQ выключена (пропустите, если её нет)
          required: false
        - label: The other proxy app has been stopped and the environment is normal / Другие прокси-приложения остановлены, окружение в порядке
          required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm / Подтверждение
      description: Please confirm / Пожалуйста, подтвердите
      options:
        - label: I have checked the documentation and found no solution / Я посмотрел документацию и не нашёл решения
          required: true
        - label: I have searched the Issue and found no related issues / Я поискал по issue и не нашёл похожих
          required: true
        - label: I am using the latest version of the app which is build from this repository / Я использую последнюю версию, собранную из этого репозитория
          required: true
        - label: I provided information which does not include sensitive information / В приложенной информации нет конфиденциальных данных
          required: true
        - label: I have provided correct, valid, and helpful information for debugging / Я привёл верную и полезную для отладки информацию
          required: true
  - type: textarea
    id: description
    attributes:
      label: BUG Description / Описание ошибки
      description: Describe your BUG here / Опишите ошибку
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior / Ожидаемое поведение
      description: What you expect to happen / Что должно было произойти
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction Steps / Шаги воспроизведения
      description: How to reproduce / Как воспроизвести
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Debug Log / Отладочный лог
      description: Download from Log -> Debug Log then upload it to here / Скачайте в Журнал -> Отладочный лог и прикрепите файл сюда (перетащите файл, не вставляйте содержимое текстом)
    validations:
      required: true
  - type: textarea
    id: app_log
    attributes:
      label: App Log / Лог приложения
      description: Attach your app log / Приложите лог приложения
    validations:
      required: true
  - type: textarea
    id: core_log
    attributes:
      label: Core Log / Лог ядра
      description: Attach your core log (info required, debug recommended) / Приложите лог ядра (уровень не ниже info, лучше debug)
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Information / Дополнительная информация
      description: Any other information you think might be helpful to solve this BUG / Любая другая информация, которая поможет исправить ошибку
    validations:
      required: false
